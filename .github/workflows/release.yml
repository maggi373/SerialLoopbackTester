name: Build release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path serial_tester_gui.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $match) {
              throw "APP_VERSION was not found."
          }
          $expectedTag = "v$($match.Matches[0].Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match $expectedTag."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows packages
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            dist/SerialLoopbackTester-v*-portable.zip
            dist/installer/SerialLoopbackTester-v*-installer.exe

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pip python3-tk python3-venv
          python3 -m venv .venv

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"$/\1/p' serial_tester_gui.py)"
          test -n "$app_version"
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Build Linux package and bundle Moxa drivers
        run: PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" bash ./build_linux.sh

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-files
          if-no-files-found: error
          path: |
            dist/SerialLoopbackTester-v*-linux-*.tar.gz
            build/moxa-drivers/*.tgz
            build/moxa-drivers/*.tar

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release files
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Serial Loopback Tester $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

name: Build release

"on":
  release:
    types:
      - published
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and upload (for example 1.3.0 or v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Verify tag matches application version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        run: |
          $match = Select-String -Path serial_tester_gui.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $match) {
              throw "APP_VERSION was not found."
          }
          $expectedVersion = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -ne $expectedVersion) {
              throw "Tag $env:RELEASE_TAG does not match application version $expectedVersion."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows packages
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            dist/SerialLoopbackTester-v*-portable.zip
            dist/installer/SerialLoopbackTester-v*-installer.exe

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pip python3-tk python3-venv
          python3 -m venv .venv

      - name: Verify tag matches application version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          app_version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"$/\1/p' serial_tester_gui.py)"
          test -n "$app_version"
          tag_version="${RELEASE_TAG#v}"
          test "$tag_version" = "$app_version"

      - name: Build Linux package and bundle Moxa drivers
        run: PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" bash ./build_linux.sh

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-files
          if-no-files-found: error
          path: |
            dist/SerialLoopbackTester-v*-linux-*.tar.gz
            build/moxa-drivers/*.tgz
            build/moxa-drivers/*.tar

  release:
    name: Publish GitHub release assets
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release files
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Serial Loopback Tester $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
